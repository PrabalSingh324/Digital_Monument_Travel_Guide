<!-- CRUD : Read -->
{% extends 'adminpanel/base.html' %}

{% block body %}

<div class="content">

    <h1>View Monuments</h1>

    <table class="table">

        <tr>
            <th>Image</th>
            <th>Monument Name</th>
            <th>Category</th>
            <th>City</th>
            <th>State</th>
            <th>Action</th>
        </tr>

        {% for i in monuments %}

        <tr>

            <td>
                <img src="{{ i.monument_image.url }}" width="100">
            </td>

            <td>{{ i.monument_name }}</td>
            <td>{{ i.category }}</td>
            <td>{{ i.city }}</td>
            <td>{{ i.state }}</td>

            <td>

                        <!-- edit button -->
                    <a href="{% url 'edit_monument' i.id %}" class="edit-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                    </a>

                    <!-- del button -->
                    <a href="{% url 'delete_monument' i.id %}"
                    class="delete-btn"
                    onclick="return confirm('Are you sure you want to delete this monument?')">
                    <i class="fa-solid fa-trash"></i>
                    </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
