{% extends 'adminpanel/base.html' %}

{% block body %}

<div class="content">

    <h1>View Gallery</h1>

    <table class="table">

        <tr>
            <th>Image</th>
            <th>Monument</th>
            <th>Caption</th>
            <th>Action</th>
        </tr>

        {% for i in gallery %}

        <tr>

            <td>
                <img src="{{ i.image.url }}" width="120">
            </td>

            <td>
                {{ i.monument.monument_name }}
            </td>

            <td>
                {{ i.caption }}
            </td>

            <td>

                <a href="{% url 'delete_gallery' i.id %}"
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this image?')">

                    <i class="fa-solid fa-trash"></i>

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
