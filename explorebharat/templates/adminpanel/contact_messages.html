{% extends 'adminpanel/base.html' %}
{% load static %}

{% block body %}

<div class="content">

    <h1>Contact Messages</h1>

    <table class="table">

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            {% for i in contacts %}

            <tr>
                <td>{{ i.full_name }}</td>
                <td>{{ i.email }}</td>
                <td>{{ i.subject }}</td>
                <td>{{ i.message }}</td>

                <td>
                    <a href="{% url 'delete_contact' i.id %}"
                       onclick="return confirm('Are you sure you want to delete this message?')">

                        <button style="background:#dc3545;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">
                            Delete
                        </button>

                    </a>
                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="5" style="text-align:center;">
                    No Contact Messages Found
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
