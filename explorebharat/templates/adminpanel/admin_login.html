<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
           
            background: url(explorebharat/static/images/admin_bg.jpg)
            
        }

        .login-box{
            width:380px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            background:#0d6efd;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0b5ed7;
        }

    </style>
</head>
<body>

<div class="login-box">

<h2>Admin Login</h2>

<form method="post">

{% csrf_token %}

<input type="email" name="email" placeholder="Admin Email" required>

<input type="password" name="password" placeholder="Password" required>

<button>Login</button>

</form>

</div>

{% if error == "yes" %}
<script>
alert("Invalid Admin Credentials");
</script>
{% endif %}

{% if error == "no" %}
<script>
alert("Welcome Admin");
window.location="{% url 'dashboard' %}";
</script>
{% endif %}

</body>
</html>
