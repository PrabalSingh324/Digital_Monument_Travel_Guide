{% extends 'adminpanel/base.html' %}
{% load static %}

{% block body %}

<div class="content">

    <h1>Registered Users</h1>

    <table class="table">

        <thead>
            <tr>
                <th>Full Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            {% for i in users %}

            <tr>

                <td>{{ i.fullname }}</td>
                <td>{{ i.username }}</td>
                <td>{{ i.email }}</td>
                <td>{{ i.phone }}</td>
                <td>{{ i.gender }}</td>

                <td>

                    <a href="{% url 'delete_user' i.id %}"
                       onclick="return confirm('Delete this user?')">

                        <button style="background:#dc3545;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">
                            Delete
                        </button>

                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="6" style="text-align:center;">
                    No Registered Users Found
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
